    <style>
        body {
            background-color: #050f26; /* Navy Deep */
            color: #f3ead6; /* Cream */
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        
        h1, .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .font-mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        /* Container do Three.js */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        /* Estilização dos Cards (Glassmorphism + Laurel Border) */
        .glass-card {
            background: rgba(18, 42, 99, 0.4); /* Navy Card */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(201, 161, 59, 0.16); /* Gold border */
            position: relative;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #c9a13b, #dc2626); /* Dourado para Vermelho */
            opacity: 0.7;
            border-radius: 2px 0 0 2px;
        }

        /* Controles Sticky (Glassmorphism) */
        #controls {
            background: rgba(5, 15, 38, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(201, 161, 59, 0.22);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #050f26; }
        ::-webkit-scrollbar-thumb { background: #1a337a; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #c9a13b; }

        /* Dropdown custom */
        .group-panel {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 280px;
            max-width: 360px;
            background: rgba(18, 42, 99, 0.95);
            border: 1px solid rgba(201, 161, 59, 0.32);
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            padding: 8px;
            z-index: 20;
            max-height: 360px;
            overflow-y:auto;
        }
    </style>
</head>
<body class="antialiased selection:bg-brand-gold selection:text-brand-dark overflow-x-hidden">

    <div id="canvas-container"></div>

    <header class="relative min-h-[72vh] flex flex-col items-center justify-center text-center px-4 pt-12 pb-8">
        <div class="hero-content z-10 flex flex-col items-center max-w-5xl">
            <div class="mb-6 flex items-center justify-center rounded-full shadow-[0_8px_30px_rgba(0,0,0,0.55)]">
                <img src="EMBLEMA GABINETE NACIONAL fundo vazio.png" alt="Emblema Ordem em Progresso" class="w-28 h-28 md:w-36 md:h-36 object-contain drop-shadow-[0_0_18px_rgba(201,161,59,0.45)]">
            </div>

            <p class="font-mono text-brand-gold text-[10px] md:text-xs tracking-[0.24em] uppercase mb-3">DEMolay Brasil • Gestão 2026/2027</p>
            <h1 class="text-5xl md:text-7xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-gray-400 leading-none">
                Gabinete Nacional
            </h1>
            <p class="font-serif italic text-xl md:text-2xl text-brand-gold mb-8">
                Ordem em Progresso
            </p>
            <p class="font-serif text-base md:text-xl text-brand-gold/90 mb-6">
                Diretório de contatos oficiais
            </p>

            <a href="#directory" class="explore-btn flex items-center justify-center gap-2 bg-transparent border border-brand-gold/50 text-brand-gold px-4 py-2 rounded-full font-medium text-sm hover:bg-brand-gold hover:text-brand-dark transition-all duration-300 shadow-[0_0_18px_rgba(201,161,59,0.15)]">
                <i class="ph-bold ph-arrow-down text-base"></i>
            </a>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-28 bg-gradient-to-t from-brand-dark to-transparent"></div>
    </header>

    <div id="controls" class="sticky top-0 z-50 py-4 px-4 shadow-xl">
        <div class="container mx-auto max-w-[1080px] flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="search-wrap relative w-full sm:max-w-md">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-brand-gold text-lg"></i>
                <input type="text" id="search" placeholder="Busque por Nome, Cargo, UF ou CID..." 
                       class="w-full pl-12 pr-4 py-3 bg-white/5 border border-brand-gold/30 rounded-full text-white placeholder:text-brand-gold/70 outline-none focus:border-brand-gold transition">

                <div id="filter-panel" class="group-panel hidden">
                    <div class="mb-2 px-2 pb-2 border-b border-brand-gold/20">
                        <p class="font-mono text-[10px] uppercase tracking-[0.22em] text-brand-gold/80">Filtrar por setor</p>
                    </div>
                    <div id="filter-options" class="space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <main id="directory" class="relative z-10 container mx-auto px-4 py-16 max-w-[1080px]">
        <div id="directory-container" class="space-y-16">
            <div id="loader" class="text-center py-20 text-brand-gold font-serif italic text-2xl">Carregando gabinete...</div>
        </div>
    </main>

    <footer class="border-t border-brand-gold/20 bg-black/20 py-12 text-center">
        <div class="container mx-auto px-4 max-w-[1080px]">
            <p class="font-mono text-[11px] uppercase tracking-wider text-brand-gold">Desenvolvido para a Gestão "Ordem em Progresso"</p>
            <p class="font-mono text-[10px] text-brand-gold/70 mt-2">© 2026/2027 Gabinete Nacional do DeMolay Brasil</p>

    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. CARREGAR E RENDERIZAR DADOS
            const rawData = document.getElementById('gn-data').textContent;
            let cabinetData = [];
            
            try {
                const parsed = JSON.parse(rawData);
                cabinetData = Array.isArray(parsed) && Array.isArray(parsed[0]) ? parsed[0] : parsed;
            } catch (e) {
                console.error("Erro ao fazer parse do JSON:", e);
                return;
            }

            const container = document.getElementById('directory-container');
            const searchInput = document.getElementById('search');
            const nav = document.getElementById('quick-nav');
            const filterPanel = document.getElementById('filter-panel');
            const filterOptions = document.getElementById('filter-options');
            let activeFilter = 'all';
            
            // Renderização Inicial
            renderFilteredContent(cabinetData);
            renderFilterOptions();

            function renderFilterOptions() {
                const groups = ['all', ...new Set(cabinetData.map(section => section.group))];
                filterOptions.innerHTML = '';

                groups.forEach(group => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = `w-full text-left px-3 py-2 rounded-lg text-sm transition ${
                        activeFilter === group
                            ? 'bg-brand-gold text-brand-dark font-semibold'
                            : 'text-white/80 hover:bg-white/5 hover:text-white'
                    }`;
                    button.textContent = group === 'all' ? 'Todos os setores' : group;
                    button.addEventListener('click', () => {
                        activeFilter = group;
                        renderFilterOptions();
                        searchInput.focus();
                        applySearch();
                    });
                    filterOptions.appendChild(button);
                });
            }

            function toggleFilterPanel(forceOpen = null) {
                const shouldOpen = forceOpen !== null ? forceOpen : filterPanel.classList.contains('hidden');
                filterPanel.classList.toggle('hidden', !shouldOpen);
            }

            searchInput.addEventListener('focus', () => toggleFilterPanel(true));
            searchInput.addEventListener('click', () => toggleFilterPanel(true));

            document.addEventListener('click', (event) => {
                const isInSearchArea = searchInput.closest('.search-wrap')?.contains(event.target);
                if (!isInSearchArea) {
                    toggleFilterPanel(false);
                }
            });

            function normalizeStr(str) {
                if (!str) return '';
                return String(str)
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .trim();
            }

            function getWordVariants(word) {
                const variants = new Set([word]);
                if (word.endsWith('oes') && word.length > 4) {
                    variants.add(word.slice(0, -3) + 'ao');
                }
                if (word.endsWith('ao') && word.length > 3) {
                    variants.add(word.slice(0, -2) + 'oes');
                }
                if (word.endsWith('res') && word.length > 4) {
                    variants.add(word.slice(0, -2));
                }
                if (word.endsWith('s') && word.length > 3) {
                    variants.add(word.slice(0, -1));
                }
                return Array.from(variants);
            }

            function applySearch() {
                const rawTerm = searchInput.value.trim();
                const normTerm = normalizeStr(rawTerm);
                const tokens = normTerm.split(/\s+/).filter(Boolean);

                const acronymMap = {
                    'cniec': 'cnie — castelos',
                    'cniep': 'cnie — priorados',
                    'cnier': 'cnie — regioes',
                    'cnieg': 'cnie — gabinetes',
                    'cnie-c': 'cnie — castelos',
                    'cnie-p': 'cnie — priorados',
                    'cnie-r': 'cnie — regioes',
                    'cnie-g': 'cnie — gabinetes',
                    'crnc': 'crn — castelos',
                    'crnp': 'crn — priorados',
                    'crnr': 'crn — regioes',
                    'crng': 'crn — gabinetes',
                    'crn-c': 'crn — castelos',
                    'crn-p': 'crn — priorados',
                    'crn-r': 'crn — regioes',
                    'crn-g': 'crn — gabinetes',
                    'snoc': 'cavalaria',
                    'snoe': 'escudeiros'
                };

                const mappedTerm = acronymMap[normTerm];

                const filteredData = cabinetData
                    .filter(section => activeFilter === 'all' || section.group === activeFilter)
                    .map(section => {
                        const secLabel = normalizeStr(section.label || '');
                        const secSheet = normalizeStr(section.sheet || '');
                        const secGroup = normalizeStr(section.group || '');
                        const secCombined = `${secLabel} ${secSheet} ${secGroup}`;
                        const secWords = secCombined.split(/[^a-z0-9]+/);

                        let isSectionMatch = false;
                        if (tokens.length > 0) {
                            if (mappedTerm && (secLabel.includes(mappedTerm) || secSheet.includes(mappedTerm))) {
                                isSectionMatch = true;
                            } else if (normTerm.length > 2 && secCombined.includes(normTerm)) {
                                isSectionMatch = true;
                            } else {
                                const allTokensMatchSection = tokens.every(token => {
                                    if (token.length <= 2) {
                                        return secWords.includes(token);
                                    }
                                    const variants = getWordVariants(token);
                                    return variants.some(v => secCombined.includes(v));
                                });
                                if (allTokensMatchSection) {
                                    isSectionMatch = true;
                                }
                            }
                        }

                        return {
                            ...section,
                            entries: section.entries.filter(person => {
                                if (isSectionMatch) return true;
                                if (tokens.length === 0) return true;

                                const normNome = normalizeStr(person.nome || '');
                                const normCargo = normalizeStr(person.cargo || '');
                                const normUf = normalizeStr(person.uf || '');
                                const cidStr = person.cid ? String(person.cid) : '';
                                const cidDigits = person.cid ? String(person.cid).replace(/\D/g, '') : '';
                                const normCoord = normalizeStr(person.coordena || '');
                                const normAtiv = person.atividades ? (
                                    Array.isArray(person.atividades) 
                                        ? person.atividades.map(normalizeStr).join(' ')
                                        : normalizeStr(person.atividades)
                                ) : '';

                                const combinedText = `${normNome} ${normCargo} ${normUf} ${normCoord} ${normAtiv}`;
                                const words = combinedText.split(/[^a-z0-9]+/);

                                return tokens.every(token => {
                                    const tDigits = token.replace(/\D/g, '');
                                    if (tDigits.length >= 3 && (cidDigits.includes(tDigits) || cidStr.includes(token))) {
                                        return true;
                                    }
                                    if (token.length <= 2) {
                                        return normUf === token || words.includes(token);
                                    }
                                    const variants = getWordVariants(token);
                                    return variants.some(v => combinedText.includes(v));
                                });
                            })
                        };
                    })
                    .filter(section => section.entries.length > 0);

                renderFilteredContent(filteredData, rawTerm);
            }

            // Input de Busca Dinâmica & Teclas (Enter / Escape)
            searchInput.addEventListener('input', applySearch);

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    toggleFilterPanel(false);
                    applySearch();
                    const controlsEl = document.getElementById('controls');
                    if (controlsEl) {
                        controlsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                } else if (e.key === 'Escape') {
                    toggleFilterPanel(false);
                    searchInput.blur();
                }
            });

            // Função principal de filtragem e renderização
            function renderFilteredContent(data, term = "") {
                container.innerHTML = ''; // Limpa container

                if (data.length === 0 && term !== "") {
                    container.innerHTML = `<div class="text-center py-20 text-brand-gold font-serif italic text-2xl">Nenhum contato encontrado para "${term}".</div>`;
                    return;
                }

                data.forEach((section, index) => {
                    const sectionEl = document.createElement('section');
                    sectionEl.id = `section-${index}`;
                    sectionEl.className = 'pt-10'; // padding top para âncoras

                    const headerHtml = `
                        <div class="flex items-center gap-4 mb-8 section-header">
                            <div class="h-[2px] flex-grow bg-gradient-to-r from-transparent to-brand-gold/30"></div>
                            <h2 class="font-serif text-2xl md:text-4xl font-semibold text-center text-white whitespace-nowrap">
                                ${section.label}
                            </h2>
                            <div class="h-[2px] flex-grow bg-gradient-to-l from-transparent to-brand-gold/30"></div>
                        </div>
                    `;

                    // Grid com columns dinâmicas
                    const gridEl = document.createElement('div');
                    gridEl.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';

                    // Injetar cards
                    section.entries.forEach(person => {
                        const hasPhone = Boolean(person.wa && person.telefone && person.telefone.trim() !== '');
                        const isMceTitle = ['MCE', 'MCD'].includes(person.cargo);
                        const isMceaTitle = ['MCEA', 'MCDA'].includes(person.cargo);

                        const cardHtml = `
                            <div class="flex items-center justify-between gap-2 mb-2">
                                ${isMceTitle ? `
                                <div class="cargo inline-flex items-center font-mono text-[11px] font-bold uppercase tracking-wider text-brand-dark bg-gradient-to-r from-brand-gold to-amber-300 px-2.5 py-0.5 rounded-full shadow-[0_0_12px_rgba(201,161,59,0.35)]">${person.cargo}</div>
                                ` : isMceaTitle ? `
                                <div class="cargo inline-flex items-center font-mono text-[11px] font-semibold uppercase tracking-wider text-brand-gold bg-brand-gold/10 border border-brand-gold/40 px-2.5 py-0.5 rounded-full shadow-[0_0_8px_rgba(201,161,59,0.15)]">${person.cargo}</div>
                                ` : `
                                <div class="cargo font-mono text-[10.5px] tracking-[0.09em] uppercase text-brand-gold-bright/80">${person.cargo}</div>
                                `}
                                ${person.cid ? `<div class="cid font-mono text-[10px] text-brand-gold/80 bg-brand-gold/10 px-2 py-0.5 rounded border border-brand-gold/20" title="CID">CID ${person.cid}</div>` : ''}
                            </div>
                            <h3 class="nome font-sans font-semibold text-[15px] text-white leading-tight mb-2">${person.nome}</h3>
                            ${person.coordena ? `
                            <div class="coordena mb-3 mt-1">
                                <span class="text-brand-gold/70 font-mono text-[9px] uppercase tracking-wider block mb-0.5">Coordena:</span>
                                <span class="bg-brand-gold/10 border border-brand-gold/30 px-2 py-0.5 rounded text-[10.5px] font-mono text-brand-gold font-medium inline-block">${person.coordena}</span>
                            </div>
                            ` : ''}
                            ${person.atividades && person.atividades.length ? `
                            <div class="atividades mb-3 mt-1">
                                <span class="text-brand-gold/70 font-mono text-[9px] uppercase tracking-wider block mb-1">Responsável por:</span>
                                <div class="flex flex-wrap gap-1">
                                    ${person.atividades.map(a => `<span class="bg-white/5 border border-white/10 px-1.5 py-0.5 rounded text-[10px] text-white/80 leading-tight">${a}</span>`).join('')}
                                </div>
                            </div>
                            ` : ''}
                            
                            <div class="meta mt-auto pt-3 border-t border-white/10 flex items-center justify-between gap-4 z-10">
                                <span class="uf font-mono text-[11px] text-white/70 border border-white/10 rounded-[6px] px-2.5 py-1 z-10">
                                    ${person.uf || '--'}
                                </span>
                                ${hasPhone ? `
                                <a href="https://wa.me/${person.wa}" target="_blank" 
                                   class="wa-link flex items-center gap-2 text-brand-gold/80 hover:text-brand-gold transition z-10">
                                    <i class="ph-fill ph-whatsapp-logo text-xl"></i>
                                    <span class="font-mono text-[12px] text-white/90 group-hover:text-brand-gold">${person.telefone}</span>
                                </a>
                                ` : `
                                <span class="flex items-center gap-1.5 text-white/40 text-[11px] font-mono">
                                    <i class="ph ph-phone-slash text-base"></i>
                                    <span>Aguardando dados</span>
                                </span>
                                `}
                            </div>
                        `;
                        const card = document.createElement('div');
                        card.className = 'glass-card rounded-[14px] p-6 flex flex-col hover:-translate-y-2 transition-transform duration-300 member-card';
                        card.innerHTML = cardHtml;
                        gridEl.appendChild(card);
                    });

                    sectionEl.innerHTML = headerHtml;
                    sectionEl.appendChild(gridEl);
                    container.appendChild(sectionEl);
                });

                // Reiniciar animações após nova renderização
                const isSearching = Boolean(term && term.trim() !== "");
                setTimeout(() => initAnimations(isSearching), 50);
            }

            // 2. ANIMAÇÕES (GSAP & Anime.js)
            function initAnimations(isSearch = false) {
                gsap.registerPlugin(ScrollTrigger);

                // Limpar animações antigas se houver
                ScrollTrigger.getAll().forEach(trigger => trigger.kill());

                if (isSearch) {
                    // Quando há busca ativa, exibe os cards imediatamente com animação fluida, sem depender de ScrollTrigger
                    gsap.fromTo('.section-header',
                        { opacity: 0, y: 15 },
                        { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out', clearProps: 'all' }
                    );
                    gsap.fromTo('.member-card',
                        { opacity: 0, y: 20 },
                        { opacity: 1, y: 0, duration: 0.35, stagger: 0.03, ease: 'power2.out', clearProps: 'all' }
                    );
                } else {
                    // Scroll Trigger para seções e cards no diretório completo
                    gsap.utils.toArray('section').forEach(section => {
                        const header = section.querySelector('.section-header');
                        const cards = section.querySelectorAll('.member-card');

                        // Animar Título
                        gsap.from(header, {
                            scrollTrigger: {
                                trigger: section,
                                start: "top 85%",
                            },
                            y: 30,
                            opacity: 0,
                            duration: 0.7,
                            ease: "power2.out"
                        });

                        // Animar Cards (Stagger)
                        gsap.from(cards, {
                            scrollTrigger: {
                                trigger: section,
                                start: "top 80%",
                            },
                            y: 35,
                            opacity: 0,
                            duration: 0.5,
                            stagger: 0.08,
                            ease: "back.out(1.2)"
                        });
                    });

                    ScrollTrigger.refresh();
                }

                // Anime.js para efeito nos links do WhatsApp
                document.querySelectorAll('.wa-link').forEach(link => {
                    link.addEventListener('mouseenter', () => {
                        anime({
                            targets: link.querySelector('i'),
                            scale: [1, 1.25, 1],
                            rotate: [0, -15, 15, 0],
                            duration: 700,
                            easing: 'easeInOutSine'
                        });
                    });
                });

                // Smooth scroll para navegação rápida
                document.querySelectorAll('#quick-nav a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        e.preventDefault();
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) {
                            target.scrollIntoView({
                                behavior: 'smooth'
                            });
                        }
                    });
                });
            }

            // Inicial Hero Animation
            gsap.from(".hero-content > *", {
                y: 50,
                opacity: 0,
                duration: 1.2,
                stagger: 0.2,
                ease: "power3.out",
                delay: 0.3
            });

            // 3. BACKGROUND THREE.JS
            function initThreeJS() {
                const container = document.getElementById('canvas-container');
                const scene = new THREE.Scene();
                
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 50;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(renderer.domElement);

                // Geometria (Particles)
                const pointsGeometry = new THREE.BufferGeometry();
                const particlesCount = window.innerWidth < 768 ? 500 : 1200;
                const posArray = new Float32Array(particlesCount * 3);

                for(let i = 0; i < particlesCount * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 120;
                }

                pointsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.2,
                    color: 0xc9a13b, // Gold
                    transparent: true,
                    opacity: 0.4,
                    blending: THREE.AdditiveBlending
                });

                const particlesMesh = new THREE.Points(pointsGeometry, material);
                scene.add(particlesMesh);

                // Mouse Interactivity
                let mouseX = 0;
                let mouseY = 0;

                document.addEventListener('mousemove', (event) => {
                    mouseX = event.clientX / window.innerWidth - 0.5;
                    mouseY = event.clientY / window.innerHeight - 0.5;
                });

                // Animation loop
                const clock = new THREE.Clock();
                function animate() {
                    requestAnimationFrame(animate);
                    const elapsedTime = clock.getElapsedTime();

                    particlesMesh.rotation.y = elapsedTime * 0.05;
                    particlesMesh.rotation.x = elapsedTime * 0.02;

                    // Reação suave ao mouse
                    particlesMesh.rotation.y += mouseX * 0.1;
                    particlesMesh.rotation.x += mouseY * 0.1;

                    renderer.render(scene, camera);
                }
                animate();

                // Resize handler
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            // Iniciar ThreeJS
            initThreeJS();

        });
    </script>
</body>
</html>
